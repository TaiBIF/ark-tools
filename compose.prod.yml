services:
  flask:
    build:
      dockerfile: ./docker/Dockerfile_prod
    expose:
      - 8001
    environment:
      - LOG_TO_FILE=1
    volumes:
      - ../arktools-volumes/logs/gunicorn:/var/log/gunicorn

  nginx:
    image: nginx:alpine
    restart: always
    # reload every 6h so certs renewed by the certbot service get picked up
    command: /bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & exec nginx -g "daemon off;"'
    ports:
      - 80:80
      - 443:443
    links:
      - flask
    volumes:
      - ./docker/nginx:/etc/nginx/conf.d
      - ../arktools-volumes/certbot/conf:/etc/letsencrypt
      - ../arktools-volumes/certbot/www:/var/www/certbot
      - ../arktools-volumes/logs/nginx:/var/log/nginx
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    depends_on:
      nginx:
        condition: service_healthy
    volumes:
      - ../arktools-volumes/certbot/conf:/etc/letsencrypt
      - ../arktools-volumes/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"